<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dhruv Bhanushali | 3D Interactive Portfolio</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Gochi+Hand&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #f2e3cf; /* Paper Background */
            font-family: 'Inter', sans-serif; 
            color: #171717;
            user-select: none;
        }
        
        /* UI Overlay Elements */
        #ui-layer {
            position: absolute;
            top: 24px;
            left: 24px;
            z-index: 10;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(4px);
            border: 2px solid #171717;
            padding: 24px;
            box-shadow: 6px 6px 0px 0px rgba(23,23,23,1);
            max-width: 350px;
        }

        #controls-hint {
            position: absolute;
            top: 24px;
            right: 24px;
            z-index: 10;
            display: flex;
            gap: 8px;
        }
        
        .key {
            background: #fff;
            border: 2px solid #171717;
            padding: 8px 14px;
            font-family: 'Courier Prime', monospace;
            font-weight: bold;
            font-size: 16px;
            color: #171717;
            box-shadow: 3px 3px 0px 0px rgba(23,23,23,1);
        }

        /* The dynamic resume panel */
        #data-panel {
            position: absolute;
            bottom: -400px; 
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 600px;
            background: #fff;
            border: 3px solid #171717;
            padding: 32px;
            transition: bottom 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 8px 8px 0px 0px rgba(23,23,23,1);
            z-index: 10;
        }

        #data-panel.active {
            bottom: 40px;
        }

        #mobile-blocker {
            display: none;
            position: fixed;
            inset: 0;
            background: #f2e3cf;
            z-index: 9999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }

        @media (max-width: 768px) {
            #mobile-blocker { display: flex; }
        }
    </style>
</head>
<body>

    <!-- Mobile Blocker Screen -->
    <div id="mobile-blocker">
        <h2 class="text-4xl font-handwriting mb-4 text-[#171717]">PC Required</h2>
        <p class="text-[#171717] font-typewriter mb-8 max-w-sm">The 3D WebGL experience requires a keyboard to pilot the ship. Please return to the paper site.</p>
        <a href="index.html" class="px-6 py-3 bg-[#e35342] text-white border-2 border-[#171717] font-bold shadow-[4px_4px_0px_0px_rgba(23,23,23,1)]">Back to Index</a>
    </div>

    <!-- UI Overlay -->
    <div id="ui-layer" class="hidden md:block">
        <h1 class="text-2xl font-bold mb-1 font-typewriter text-[#171717]">DHRUV B.</h1>
        <p class="text-[#e35342] font-handwriting text-2xl mb-4">Mission Control</p>
        <p class="text-[#171717] text-sm mb-6 leading-relaxed font-medium">Pilot the ship using WASD to the glowing data beacons to decrypt my work log.</p>
        <a href="index.html" class="text-sm font-bold text-[#2754a9] hover:underline flex items-center gap-2 transition">
            [ EXIT TO INDEX ]
        </a>
    </div>

    <div id="controls-hint" class="hidden md:flex">
        <div class="key">W</div>
        <div class="key">A</div>
        <div class="key">S</div>
        <div class="key">D</div>
    </div>

    <!-- Dynamic Data Panel -->
    <div id="data-panel">
        <div class="absolute top-0 right-0 border-2 border-[#e35342] text-[#e35342] font-typewriter font-bold px-2 py-1 transform rotate-3 m-4">MILSTONE</div>
        <p id="panel-date" class="bg-[#171717] text-[#f2e3cf] inline-block px-2 py-1 font-bold text-xs tracking-wider mb-4"></p>
        <h2 id="panel-title" class="text-5xl font-handwriting mb-4 text-[#171717]"></h2>
        <p id="panel-desc" class="text-[#171717] font-medium leading-relaxed text-lg border-t-2 border-dashed border-[#171717] pt-4"></p>
    </div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // 1. SCENE SETUP
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xf2e3cf); // Paper color
        scene.fog = new THREE.FogExp2(0xf2e3cf, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
        document.body.appendChild(renderer.domElement);

        // 2. LIGHTING
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // 3. ENVIRONMENT (Sketch Grid)
        const gridHelper = new THREE.GridHelper(400, 100, 0x171717, 0x171717);
        gridHelper.material.opacity = 0.1;
        gridHelper.material.transparent = true;
        gridHelper.position.y = -1;
        scene.add(gridHelper);

        // 4. THE PLAYER SHIP (Ink Black)
        const ship = new THREE.Group();
        
        const bodyGeo = new THREE.CylinderGeometry(0.5, 0.8, 4, 8);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x171717, roughness: 0.8 });
        const body = new THREE.Mesh(bodyGeo, bodyMat);
        body.rotation.x = Math.PI / 2;
        ship.add(body);

        const cockpitGeo = new THREE.CylinderGeometry(0.4, 0.4, 1.5, 8);
        const cockpitMat = new THREE.MeshStandardMaterial({ color: 0xe35342, roughness: 0.4 });
        const cockpit = new THREE.Mesh(cockpitGeo, cockpitMat);
        cockpit.position.set(0, 0.5, 0.5);
        cockpit.rotation.x = Math.PI / 2;
        ship.add(cockpit);

        const wingGeo = new THREE.BoxGeometry(4, 0.1, 1.5);
        const wingMat = new THREE.MeshStandardMaterial({ color: 0x171717 });
        const wings = new THREE.Mesh(wingGeo, wingMat);
        wings.position.set(0, 0, -1);
        ship.add(wings);

        scene.add(ship);
        ship.position.y = 1;

        // 5. RESUME MILESTONES (Data Beacons)
        const milestones = [
            { 
                x: 0, z: -30, 
                color: 0xe35342, 
                date: "Jul 2024 - Feb 2025", 
                title: "Maker Mela Lead", 
                desc: "Anchored on-ground operations for Asia's largest maker fair. Coordinated logistics for 400+ makers and 1,00,000+ visitors over 2 days." 
            },
            { 
                x: -40, z: -50, 
                color: 0x2754a9, 
                date: "Apr 2020 - Dec 2023", 
                title: "4x Founder", 
                desc: "Built Atlas Esports to 7,000+ members. Founded Sacchai India, running a Gen-Z news pipeline solo for 14 months." 
            },
            { 
                x: 40, z: -50, 
                color: 0xe35342, 
                date: "Jul 2024 - Mar 2026", 
                title: "Sponsorship Lead", 
                desc: "Led S.K. Somaiya's intercollegiate fest circuit winning 14+ trophies. Closed ₹3L in cash sponsorships." 
            },
            { 
                x: 0, z: -80, 
                color: 0x171717, 
                date: "2023 - 2026", 
                title: "Academics", 
                desc: "BCA Graduate (9.94 CGPA). Selected for Aspire Leaders Program & McKinsey Forward Program. Prepping for CAT 2026." 
            }
        ];

        const beacons = [];
        milestones.forEach(data => {
            const pGeo = new THREE.CylinderGeometry(1, 1, 10, 8);
            const pMat = new THREE.MeshBasicMaterial({ color: data.color, wireframe: true });
            const pillar = new THREE.Mesh(pGeo, pMat);
            pillar.position.set(data.x, 4, data.z);
            scene.add(pillar);

            const coreGeo = new THREE.OctahedronGeometry(1.5);
            const coreMat = new THREE.MeshStandardMaterial({ color: data.color });
            const core = new THREE.Mesh(coreGeo, coreMat);
            core.position.set(data.x, 2, data.z);
            scene.add(core);

            beacons.push({ mesh: core, data: data });
        });

        // 6. PHYSICS & CONTROLS
        const keys = { w: false, a: false, s: false, d: false, arrowup: false, arrowdown: false, arrowleft: false, arrowright: false };
        let speed = 0;
        let rotation = 0;
        const maxSpeed = 1.0;
        const acceleration = 0.015;
        const friction = 0.97;
        const turnSpeed = 0.035;

        window.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
        window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

        const panel = document.getElementById('data-panel');
        const pDate = document.getElementById('panel-date');
        const pTitle = document.getElementById('panel-title');
        const pDesc = document.getElementById('panel-desc');
        let currentActiveBeacon = null;

        function animate() {
            requestAnimationFrame(animate);

            if (keys.w || keys.arrowup) speed += acceleration;
            if (keys.s || keys.arrowdown) speed -= acceleration;
            speed *= friction; 
            
            speed = Math.max(Math.min(speed, maxSpeed), -maxSpeed / 2);

            if (Math.abs(speed) > 0.05) {
                const turnDir = speed > 0 ? 1 : -1;
                if (keys.a || keys.arrowleft) rotation += turnSpeed * turnDir;
                if (keys.d || keys.arrowright) rotation -= turnSpeed * turnDir;
            }

            ship.rotation.y = rotation;
            let targetBank = 0;
            if (keys.a || keys.arrowleft) targetBank = 0.5;
            if (keys.d || keys.arrowright) targetBank = -0.5;
            ship.rotation.z += (targetBank - ship.rotation.z) * 0.1;

            ship.position.x += Math.sin(rotation) * speed;
            ship.position.z += Math.cos(rotation) * speed;

            const cameraOffset = new THREE.Vector3(
                ship.position.x - Math.sin(rotation) * 12,
                ship.position.y + 5,
                ship.position.z - Math.cos(rotation) * 12
            );
            camera.position.lerp(cameraOffset, 0.1);
            const lookAtPos = new THREE.Vector3(ship.position.x, ship.position.y + 1, ship.position.z);
            camera.lookAt(lookAtPos);

            let insideBeacon = false;
            beacons.forEach(b => {
                b.mesh.rotation.y += 0.01;
                b.mesh.rotation.z += 0.005;
                b.mesh.position.y = 2 + Math.sin(Date.now() * 0.002) * 0.5;

                const dist = ship.position.distanceTo(b.mesh.position);
                if (dist < 10) {
                    insideBeacon = true;
                    if (currentActiveBeacon !== b.data.title) {
                        currentActiveBeacon = b.data.title;
                        pDate.innerText = b.data.date;
                        pTitle.innerText = b.data.title;
                        pDesc.innerText = b.data.desc;
                        panel.classList.add('active');
                    }
                }
            });

            if (!insideBeacon) {
                panel.classList.remove('active');
                currentActiveBeacon = null;
            }

            renderer.render(scene, camera);
        }
        
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
